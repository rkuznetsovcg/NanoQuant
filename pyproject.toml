[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoquant"
version = "0.1.0"
description = "NanoQuant: Efficient Sub-1-Bit Quantization of Large Language Models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.20.0",
    "cut_cross_entropy>=25.1.1",
    "datasets>=4.0.0",
    "gemlite>=0.4.0",
    "jinja2>=3.1",
    "lm_eval>=0.4.9",
    "loguru>=0.7.0",
    "optimum>=2.1.0",
    "torch>=2.6.0",
    "tqdm>=4.60.0",
    "transformers>=5.13.0,<6.0",
    "zeus-ml",
]

[project.optional-dependencies]
kernels = ["transformers[kernels]>=5.13.0,<6.0"]
qwen-fast = ["flash-linear-attention>=0.4.1", "causal-conv1d>=1.4.0"]
qwen-flashqla = [
    "flash-linear-attention>=0.5.2",
    "causal-conv1d>=1.4.0",
    "flash-qla>=0.1.3",
    "transformers[kernels]>=5.13.0,<6.0",
]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
nanoquant = "nanoquant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanoquant = ["kernel/**/*.cu", "kernel/**/*.cuh", "kernel/**/*.h", "kernel/**/*.cpp", "kernel/**/*.sh"]
